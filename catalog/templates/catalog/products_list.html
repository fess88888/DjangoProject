{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <div class="row text-center">
        {% for product in products %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <img src="{{ product.picture.url }}">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{product.product_name}}</h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">RUB {{product.price|floatformat:0}}</h1>
                    <h5 class="card-title pricing-card-title">Категория: {{product.category}}</h5>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>Описание: {{product.product_description|truncatechars:100}}</li>
                    </ul>
                    <a href="{% url 'catalog:products_detail' product_id=product.id %}" class="btn btn-lg btn-outline-primary">Подробно</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
  </div>
{% endblock %}
