<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>

    <nav class="ms-5 d-flex align-items-center gap-2">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:post_list' %}">Блог</a>

        {% if user.is_authenticated %}
            <span class="text-dark">{{ user.email }}</span>
            <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'users:login' %}" class="btn btn-outline-primary btn-sm">Вход</a>
            <a href="{% url 'users:register' %}" class="btn btn-primary btn-sm">Регистрация</a>
        {% endif %}
    </nav>
</div>
